# RTL433 Configuration File for rtl433-geo-logger
# 
# This configuration enables rtl_433 native GPSd support to include
# GPS coordinates (lat, lon, alt) directly in the JSON output.
#
# Usage:
#   1. Start GPSd: sudo gpsd -N /dev/ttyUSB0
#   2. Run rtl_433 with this config: rtl_433 -c rtl_433.conf -F json | rtl433-logger

# Output format: JSON
output json

# Enable GPSd integration and include lat, lon, alt fields in JSON output
# This eliminates the need for a separate GPS client in the logger
output_tag gpsd,lat,lon,alt

# Optional: Specify GPSd connection (defaults to localhost:2947)
# report_meta gpsd localhost:2947

# Frequency settings
frequency 433.92M

# Optional: Enable specific protocols (comment out to enable all)
# protocol 91  # inFactory-TH
# protocol 40  # Acurite-Tower

# Optional: Increase gain for better reception
# gain 40

# Optional: Auto gain
# gain 0

# Optional: Sample rate
# sample_rate 250k

# Optional: Hop between multiple frequencies
# hop_interval 60
# frequency 433.92M
# frequency 315M
# frequency 868.3M

# Optional: Set minimum RSSI threshold
# level_limit -30

# Optional: Output debugging info
# verbose
